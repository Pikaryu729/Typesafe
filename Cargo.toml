[package]
name = "typesafe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A focused terminal typing-practice application"
readme = "README.md"
repository = "https://github.com/Pikaryu729/Typesafe"
license = "MIT"
keywords = ["typing", "terminal", "tui", "practice", "ratatui"]
categories = ["command-line-utilities"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE-MIT",
    "README.md",
    "src/**",
    "words.txt",
]

[dependencies]
crossterm = "0.28"
dirs = "6"
rand = "0.9"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
